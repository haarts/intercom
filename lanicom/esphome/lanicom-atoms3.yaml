# lanicom on an M5Stack AtomS3 Lite with the Atomic Audio-3.5 Base: a one-button intercom.
#
# The top button is the box's one button: hold it 5 s to pair it with a button on another box
# (docs/buttons.md), then hold it to talk to that partner. The RGB LED is its ring.
#
# Base: ES8311 codec, analog MEMS mic (keep the base's mic switch on ON), NS4150B amp, enabled
# through a PI4IOE5V6408 expander. The base has no MCLK line, and the ES8311 only runs 16 kHz
# from the bit clock with 32-bit slots, so the I2S bus runs 32-bit slots both ways.
#
# First: secrets.yaml needs wifi_ssid and wifi_password next to the other secrets.
# First flash over USB-C:   esphome run lanicom-atoms3.yaml
# Then open http://<device>.local/ (user admin) and paste the network key, or bake it in with
#                           esphome -s network_key 'xxxxx-...' run lanicom-atoms3.yaml

substitutions:
  name: lanicom-atom
  friendly_name: Intercom Atom
  network_key: ""

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: "2026.7.0"
  on_boot:
    - priority: -100
      then:
        # ES8311 mic gain, straight to the codec (as on the P4).
        - lambda: |-
            id(es8311_dac).write_byte(0x14, 0x10 | (uint8_t)(id(mic_pga).state / 3));
            id(es8311_dac).write_byte(0x16, (uint8_t)(id(mic_digital).state / 6));
        - speaker.volume_set:
            id: atom_speaker
            volume: !lambda 'return id(speaker_volume).state / 100.0f;'
        - lambda: |-
            id(intercom).set_ring_brightness(0, id(ring_1_brightness).state / 100.0f);
            id(intercom).set_night_brightness(id(night_brightness).state / 100.0f);
            id(intercom).set_night_hours((int) id(night_start).state, (int) id(night_end).state);

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: SIZE

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none  # voice: no 100 ms sleeps between beacons
  ap:
    ssid: "Intercom Atom setup"

captive_portal:

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: admin
    password: !secret web_password

factory_reset:
  resets_required: 5
  max_delay: 10s
  on_increment:
    - lambda: 'id(intercom).identify(300);'

time:
  - platform: sntp
    id: sntp_clock
    timezone: Europe/Amsterdam

mdns:
  services:
    - service: "_lanicom"
      protocol: "_udp"
      port: 47100
      txt:
        v: "1"

external_components:
  - source:
      type: local
      path: components

# The base sits on the Atom's bottom header: I2C on G38/G39, I2S on G5-G8.
i2c:
  sda: GPIO38
  scl: GPIO39

pi4ioe5v6408:
  - id: base_io
    address: 0x43

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO8

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 32bit  # slot width: 16 kHz x 32 x 2 = the 1.024 MHz bit clock the ES8311 runs on
    sample_rate: 16000
    use_mclk: false
    mic_gain: 0DB  # overridden at boot by "Mic Digital Gain"

microphone:
  - platform: i2s_audio
    id: atom_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO7
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 32bit  # lanicom keeps the top 16 bits
    channel: left
    correct_dc_offset: true

speaker:
  - platform: i2s_audio
    id: atom_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO5
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 32bit  # slot width; lanicom's 16-bit stream goes out in 32-bit slots
    channel: left
    buffer_duration: 60ms
    timeout: never

lanicom:
  id: intercom
  microphone: atom_mic
  speaker: atom_speaker
  key: ${network_key}
  key_text_id: network_key_text
  name_text_id: intercom_name
  jitter_buffer: 40ms  # Wi-Fi: more jitter than wired
  jitter_buffer_max: 100ms
  frame_duration: 20ms  # half the packet rate, kinder to Wi-Fi
  bitrate: 24000
  complexity: 3
  mic_warmup: 50ms
  time_id: sntp_clock
  buttons:
    - { button: top_button, ring: led_ring }
  on_receive_start:
    - logger.log:
        format: "%s is talking"
        args: [name.c_str()]

# The RGB LED stands in for a button ring: lanicom sets a level, the LED shows it in white.
light:
  - platform: esp32_rmt_led_strip
    id: rgb_led
    pin: GPIO35
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    gamma_correct: 1.0  # lanicom's levels are already perceptual; with gamma 2.8, 10 % rounds to off
    internal: true

output:
  - platform: template
    id: led_ring
    type: float
    write_action:
      - lambda: |-
          auto call = id(rgb_led).turn_on();
          call.set_rgb(1.0f, 1.0f, 1.0f);
          call.set_brightness(state);
          call.set_transition_length(0);
          if (state <= 0.0f)
            call = id(rgb_led).turn_off();
          call.perform();

binary_sensor:
  - platform: gpio
    id: top_button
    name: "Button"
    pin: { number: GPIO41, mode: INPUT_PULLUP, inverted: true }
    filters: [delayed_on_off: 20ms]
  - platform: template
    name: "Receiving"
    icon: "mdi:account-voice"
    lambda: 'return id(intercom).is_receiving();'
  - platform: template
    name: "Talking"
    icon: "mdi:microphone"
    lambda: 'return id(intercom).is_transmitting();'

text:
  - platform: template
    id: network_key_text
    name: "Network key"
    icon: "mdi:key"
    entity_category: config
    mode: password
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 64
  - platform: template
    id: intercom_name
    name: "Intercom name"
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 32

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
  - platform: template
    name: "Intercom peers"
    icon: "mdi:lan"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(intercom).peer_count();'
    filters:
      - delta: 0.5  # only publish changes
  - platform: template
    name: "Dropped packets"
    icon: "mdi:shield-alert"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      auto s = id(intercom).get_stats();
      return s.foreign + s.auth + s.replay + s.malformed + s.unverified;
    filters:
      - delta: 0.5  # only publish changes

text_sensor:
  - platform: template
    name: "Button partner"
    icon: "mdi:link-variant"
    update_interval: 2s
    lambda: 'return id(intercom).partner_summary(0);'
    filters:
      - lambda: |-
          static std::string last;  // only publish changes
          if (x == last) return {};
          last = x;
          return x;
  - platform: template
    name: "Intercom peer list"
    icon: "mdi:format-list-bulleted"
    update_interval: 10s
    lambda: 'return id(intercom).peers_summary();'
    filters:
      - lambda: |-
          static std::string last;  // only publish changes
          if (x == last) return {};
          last = x;
          return x;
  - platform: wifi_info
    ip_address:
      name: IP Address
  - platform: version
    name: "Firmware"
    hide_timestamp: true

number:
  - platform: template
    name: "Mic Preamp"
    id: mic_pga
    entity_category: config
    unit_of_measurement: "dB"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 30
    step: 3
    initial_value: 30
    set_action:
      - lambda: 'id(es8311_dac).write_byte(0x14, 0x10 | (uint8_t)(x / 3));'
  - platform: template
    name: "Mic Digital Gain"
    id: mic_digital
    entity_category: config
    unit_of_measurement: "dB"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 42
    step: 6
    initial_value: 24
    set_action:
      - lambda: 'id(es8311_dac).write_byte(0x16, (uint8_t)(x / 6));'
  - platform: template
    name: "Speaker Volume"
    id: speaker_volume
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 65
    set_action:
      - speaker.volume_set:
          id: atom_speaker
          volume: !lambda 'return x / 100.0;'
  - platform: template
    name: "Button brightness"
    id: ring_1_brightness
    icon: "mdi:brightness-6"
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 10
    set_action:
      - lambda: 'id(intercom).set_ring_brightness(0, x / 100.0f);'
  - platform: template
    name: "Night brightness"
    id: night_brightness
    icon: "mdi:weather-night"
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 2
    set_action:
      - lambda: 'id(intercom).set_night_brightness(x / 100.0f);'
  - platform: template
    name: "Night from"
    id: night_start
    icon: "mdi:clock-start"
    entity_category: config
    unit_of_measurement: "h"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 22
    set_action:
      - lambda: 'id(intercom).set_night_start((int) x);'
  - platform: template
    name: "Night until"
    id: night_end
    icon: "mdi:clock-end"
    entity_category: config
    unit_of_measurement: "h"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 7
    set_action:
      - lambda: 'id(intercom).set_night_end((int) x);'

switch:
  - platform: gpio
    name: "Speaker Power"
    icon: "mdi:speaker"
    pin:
      pi4ioe5v6408: base_io
      number: 0
      mode:
        output: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
  - platform: factory_reset
    name: "Factory reset"
    entity_category: config
  - platform: template
    name: "Identify"
    icon: "mdi:lightbulb-on"
    on_press:
      - lambda: 'id(intercom).identify();'
  - platform: template
    name: "Unpair"
    icon: "mdi:link-variant-off"
    entity_category: config
    on_press:
      - lambda: 'id(intercom).unpair(0);'
